          - text: 7. Interpret — article section 5
          - link "Anchor" [ref=f2e285] [cursor=pointer]:
            - /url: "#interpret-article-section-5"
            - text: 
        - paragraph [ref=f2e286]: Discuss local explanations, feature effects and feature importance. The article explains these methods but prints no executable interpretation example. We do not introduce a different analysis and label it as replicated article code. Predictive importance describes a fitted model; it does not identify a causal effect.
