            - /url: "#from-the-september-introduction-to-the-article-workflow"
            - text: 
        - paragraph [ref=f2e98]:
          - text: In Part 1, we explored how learning works and applied it to West Nile surveillance. In this session, we use the heart-disease data from
          - link "Wright et al." [ref=f2e99] [cursor=pointer]:
            - /url: https://arxiv.org/html/2602.16352v1
          - text: and follow the order of their published examples. Open
          - code [ref=f2e100]: part2.Rproj
          - text: and keep this folder as the working directory.
        - paragraph [ref=f2e101]:
          - text: The authors’ companion repository is currently unavailable. This workshop implements the published examples and documents the missing setup choices in
          - link "the replication record" [ref=f2e102] [cursor=pointer]:
            - /url: http://localhost:3916/part2/references/replication-notes.md
          - text: . The frozen data and transformation details are in
          - link "the data guide" [ref=f2e103] [cursor=pointer]:
            - /url: http://localhost:3916/part2/data/README.md
          - text: .
      - generic [ref=f2e104]:
        - heading [level=2] [ref=f2e105]:
          - text: 1. Meet the data
          - link "Anchor" [ref=f2e106] [cursor=pointer]:
            - /url: "#meet-the-data"
            - text: 
        - paragraph [ref=f2e107]: The task is to distinguish existing heart disease from its absence using clinical measurements. This is a classification example, not a future cardiovascular risk score.
