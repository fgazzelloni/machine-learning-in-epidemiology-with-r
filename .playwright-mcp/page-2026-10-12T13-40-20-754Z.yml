        - heading "11. What the results mean" [level=1] [ref=f11e1084]
        - paragraph [ref=f11e1085]: The point of the workflow is not only to fit a model but to explain how machine learning works in practice.
        - paragraph [ref=f11e1086]: "A typical sequence is:"
        - list [ref=f11e1087]:
          - listitem [ref=f11e1088]: Use historical data to learn patterns.
          - listitem [ref=f11e1089]: Choose a model and specify the outcome.
          - listitem [ref=f11e1090]: Train the model on observed labels.
          - listitem [ref=f11e1091]: Predict on unseen data.
          - listitem [ref=f11e1092]: Evaluate the output with appropriate metrics.
          - listitem [ref=f11e1093]: Interpret the model in context.
        - paragraph [ref=f11e1094]: This is the bridge between the abstract learning cycle and applied epidemiology.
        - separator [ref=f11e1095]
      - generic [ref=f11e1096]:
        - heading "12. Final takeaway" [level=1] [ref=f11e1097]
        - paragraph [ref=f11e1098]: The conceptual notebook shows that learning is about using data to update model parameters or structure according to a loss function and an optimization scheme.
        - paragraph [ref=f11e1099]: "The epidemiology workflow shows how the same logic is used in a real decision problem: predict whether WNV activity will be observed in future weeks using information available at the current time."
        - paragraph [ref=f11e1100]: "The same essential pattern appears in both:"
        - code [ref=f11e1102]: data -> model -> predictions -> loss -> update -> repeat -> evaluation
        - paragraph [ref=f11e1103]: That is the heart of machine learning.
