            - text: 
        - paragraph [ref=f7e36]:
          - text: Federica Gazzelloni is an actuary, statistician, data scientist, author and instructor whose work spans health metrics, actuarial modelling, R and Python, data visualisation and reproducible research. She leads
          - link "R-Ladies Rome" [ref=f7e37] [cursor=pointer]:
            - /url: https://www.meetup.com/it-IT/rladies-rome/
          - text: and the
          - link "Rome R Users Group" [ref=f7e38] [cursor=pointer]:
            - /url: https://www.meetup.com/it-IT/rome-r-users-group/
          - text: ", and she brings that practical, collaborative style to the workshop materials in this repository."
        - paragraph [ref=f7e39]: "This experience connects directly to the workshop’s practical approach to machine learning in epidemiology: we start with a clear understanding of the modelling problem, keep the code and data workflow reproducible, and explain how model choices relate to the epidemiological question being asked."
      - generic [ref=f7e40]:
        - heading [level=2] [ref=f7e41]:
          - text: The two-part learning journey
          - link "Anchor" [ref=f7e42] [cursor=pointer]:
            - /url: "#the-two-part-learning-journey"
            - text: 
        - paragraph [ref=f7e43]: "This workshop is designed as a guided progression through two connected learning experiences:"
        - list [ref=f7e44]:
          - listitem [ref=f7e45]:
            - strong [ref=f7e46]: "Part 1 — September 2026:"
            - text: foundations of machine learning, the idea of learning itself, gradient descent, and a West Nile virus prediction workflow.
          - listitem [ref=f7e47]:
            - strong [ref=f7e48]: "Part 2 — 23 October 2026:"
            - text: a heart-disease workflow inspired by Wright et al., including trees, neural networks, evaluation, resampling and tuning.
        - paragraph [ref=f7e49]: The materials are organised so that participants can move from conceptual understanding to code-based practice without losing sight of the data, the modelling assumptions and the interpretation of results.
      - generic [ref=f7e50]:
        - heading [level=2] [ref=f7e51]:
          - text: Workshop materials and next steps
          - link "Anchor" [ref=f7e52] [cursor=pointer]:
