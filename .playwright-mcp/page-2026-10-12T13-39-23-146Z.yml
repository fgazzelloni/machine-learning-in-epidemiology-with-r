        - heading "11. What the results mean" [level=1] [ref=f9e1023]
        - paragraph [ref=f9e1024]: The point of the workflow is not only to fit a model but to explain how machine learning works in practice.
        - paragraph [ref=f9e1025]: "A typical sequence is:"
        - list [ref=f9e1026]:
          - listitem [ref=f9e1027]: Use historical data to learn patterns.
          - listitem [ref=f9e1028]: Choose a model and specify the outcome.
          - listitem [ref=f9e1029]: Train the model on observed labels.
          - listitem [ref=f9e1030]: Predict on unseen data.
          - listitem [ref=f9e1031]: Evaluate the output with appropriate metrics.
          - listitem [ref=f9e1032]: Interpret the model in context.
        - paragraph [ref=f9e1033]: This is the bridge between the abstract learning cycle and applied epidemiology.
        - separator [ref=f9e1034]
      - generic [ref=f9e1035]:
        - heading "12. Final takeaway" [level=1] [ref=f9e1036]
        - paragraph [ref=f9e1037]: The conceptual notebook shows that learning is about using data to update model parameters or structure according to a loss function and an optimization scheme.
        - paragraph [ref=f9e1038]: "The epidemiology workflow shows how the same logic is used in a real decision problem: predict whether WNV activity will be observed in future weeks using information available at the current time."
