      - generic [ref=f13e71]:
        - heading [level=2] [ref=f13e72]:
          - text: About the instructor
          - link "Anchor" [ref=f13e73] [cursor=pointer]:
            - /url: "#about-the-instructor"
            - text: 
        - paragraph [ref=f13e74]:
          - text: Federica Gazzelloni is an actuary, statistician, data scientist, author and instructor whose work spans health metrics, actuarial modelling, R and Python, data visualisation and reproducible research. She leads
          - link "R-Ladies Rome" [ref=f13e75] [cursor=pointer]:
            - /url: https://www.meetup.com/it-IT/rladies-rome/
          - text: and the
          - link "Rome R Users Group" [ref=f13e76] [cursor=pointer]:
            - /url: https://www.meetup.com/it-IT/rome-r-users-group/
          - text: ", and she brings that practical, collaborative style to the workshop materials in this repository."
        - paragraph [ref=f13e77]: "This experience connects directly to the workshop’s practical approach to machine learning in epidemiology: we start with a clear understanding of the modelling problem, keep the code and data workflow reproducible, and explain how model choices relate to the epidemiological question being asked."
      - generic [ref=f13e78]:
        - heading [level=2] [ref=f13e79]:
          - text: The two-part learning journey
          - link "Anchor" [ref=f13e80] [cursor=pointer]:
            - /url: "#the-two-part-learning-journey"
            - text: 
        - paragraph [ref=f13e81]: "This workshop is designed as a guided progression through two connected learning experiences:"
        - list [ref=f13e82]:
          - listitem [ref=f13e83]:
            - strong [ref=f13e84]: "Part 1 — September 2026:"
            - text: foundations of machine learning, the idea of learning itself, gradient descent, and a West Nile virus prediction workflow.
          - listitem [ref=f13e85]:
            - strong [ref=f13e86]: "Part 2 — 23 October 2026:"
            - text: a heart-disease workflow inspired by Wright et al., including trees, neural networks, evaluation, resampling and tuning.
        - paragraph [ref=f13e87]: The materials are organised so that participants can move from conceptual understanding to code-based practice without losing sight of the data, the modelling assumptions and the interpretation of results.
      - generic [ref=f13e88]:
        - heading [level=2] [ref=f13e89]:
          - text: Workshop materials and next steps
          - link "Anchor" [ref=f13e90] [cursor=pointer]:
            - /url: "#workshop-materials-and-next-steps"
            - text: 
        - paragraph [ref=f13e91]: The repository keeps the two session tracks easy to navigate while preserving the source files, notebook structure and project-level working directories.
        - list [ref=f13e92]:
          - listitem [ref=f13e93]:
            - link "Workshop home" [ref=f13e94] [cursor=pointer]:
              - /url: http://localhost:3916/
