              - /url: http://localhost:3916/part2/README.md
          - listitem [ref=f13e99]:
            - link "Original September workshop repository" [ref=f13e100] [cursor=pointer]:
              - /url: https://github.com/fgazzelloni/Intro-to-ml-in-epidemiology-with-r
        - paragraph [ref=f13e101]: This new repository is a workshop organization and teaching resource for the current series. The original September repository and published website remain separate and are not replaced by these materials.
